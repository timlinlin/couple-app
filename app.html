<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小天地">
<meta name="theme-color" content="#0b090d">
<title>我們的小天地</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0b090d; --bg-soft:#110e14;
  --card:#17131c; --card-2:#1e1925; --card-3:#252030;
  --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.13);
  --fg:#f4ecf3; --muted:#9d92a4; --muted-2:#6b6273;
  --accent:#ff6f91; --accent-2:#c78bff;
  --accent-soft:rgba(255,111,145,.13);
  --gold:#f0b849; --ok:#5ddc9a; --err:#ff7a7a;
  --r:20px; --r-sm:14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --nav-h: 62px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 28px);
  /* 底部一層極淡的暖光，讓純黑不死板 */
  background-image:radial-gradient(120% 55% at 50% 100%, rgba(199,139,255,.07), transparent 60%);
  background-attachment:fixed;
}
img{max-width:100%}

/* ---------- 頂欄 ---------- */
.top{
  position:sticky; top:0; z-index:30;
  padding:calc(var(--safe-t) + 12px) 16px 10px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:rgba(11,9,13,.94);
  backdrop-filter:blur(16px) saturate(1.3); -webkit-backdrop-filter:blur(16px) saturate(1.3);
}
.brand{display:flex; align-items:center; gap:8px; font-size:16px; font-weight:700; letter-spacing:.3px}
.brand .dot{width:8px; height:8px; border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 12px rgba(255,111,145,.65)}
#syncBadge{
  border:1px solid var(--line-2); background:var(--card); color:var(--muted);
  font:inherit; font-size:11.5px; font-weight:600; padding:6px 11px;
  border-radius:99px; white-space:nowrap; cursor:pointer;
}
#syncBadge.ok{color:var(--ok); border-color:rgba(93,220,154,.3); background:rgba(93,220,154,.08)}
#syncBadge.busy{color:var(--accent); border-color:rgba(255,111,145,.35)}
#syncBadge.err{color:var(--err); border-color:rgba(255,122,122,.35); background:rgba(255,122,122,.08)}

main{padding:0 14px; overflow-x:hidden}
section{display:none; animation:in .22s ease}
section.on{display:block}
@keyframes in{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

/* ---------- 卡片 ---------- */
.card{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r); padding:16px; margin-bottom:12px;
}
.h2{font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted-2); margin:0 0 12px}

/* ---------- 首頁 ---------- */
.hero{
  position:relative; overflow:hidden; text-align:center;
  background:linear-gradient(165deg,#1d1626,#141019 60%);
  border:1px solid var(--line); border-radius:26px;
  padding:30px 18px 26px; margin-bottom:12px;
}
.hero .glow{
  position:absolute; inset:-40% 20% auto; height:220px; pointer-events:none;
  background:radial-gradient(50% 50% at 50% 50%, rgba(255,111,145,.28), transparent 70%);
  filter:blur(14px);
}
.faces{position:relative; display:flex; align-items:center; justify-content:center; gap:18px}
.face{cursor:pointer}
.ava{position:relative; display:inline-block}
.face img,.face .ph{
  width:82px; height:82px; border-radius:50%; object-fit:cover; display:block;
  background:var(--card-3);
  border:2px solid rgba(255,255,255,.14);
  box-shadow:0 6px 22px rgba(0,0,0,.55), 0 0 0 5px rgba(255,111,145,.08);
}
.face .ph{display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--muted-2)}
.face .edit{
  position:absolute; right:-1px; bottom:-1px; width:26px; height:26px; border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-size:12px;
  display:flex; align-items:center; justify-content:center; border:2.5px solid #16121b;
}
.face p{margin:10px 0 0; font-size:13px; font-weight:600; color:var(--muted)}
.heart{font-size:20px; color:var(--accent); animation:beat 1.9s infinite ease-in-out;
  filter:drop-shadow(0 0 10px rgba(255,111,145,.6))}
@keyframes beat{0%,100%{transform:scale(1)}28%{transform:scale(1.22)}}
.bigday{position:relative; margin:26px 0 0; font-size:13px; color:var(--muted)}
.bigday b{
  display:block; margin:2px 0; font-size:66px; line-height:1.02; font-weight:800; letter-spacing:-2px;
  background:linear-gradient(135deg,#ffa8bd,#c78bff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.sub{font-size:12.5px; color:var(--muted-2); margin-top:8px}

/* 里程碑 */
.ms{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:13px 0; border-bottom:1px solid var(--line)}
.ms:first-child{padding-top:0}
.ms:last-child{padding-bottom:0; border-bottom:0}
.ms .d{font-size:11.5px; color:var(--muted-2); margin-top:3px}
.pill{background:var(--accent-soft); color:var(--accent); border:1px solid rgba(255,111,145,.2);
  padding:5px 11px; border-radius:99px; font-size:11.5px; font-weight:700; white-space:nowrap}

/* 統計改成三格磚 */
#stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px}
#stats .ms{
  flex-direction:column; align-items:flex-start; gap:9px; padding:13px 12px; border-bottom:0;
  background:var(--card-2); border:1px solid var(--line); border-radius:var(--r-sm);
}
#stats .ms>div{font-size:11.5px; color:var(--muted-2); line-height:1.35}
#stats .pill{background:transparent; border:0; padding:0; font-size:19px; color:var(--fg); font-weight:800}

/* ---------- 表單元件 ---------- */
label{display:block; font-size:11.5px; font-weight:600; color:var(--muted-2);
      margin:14px 0 6px; letter-spacing:.03em}
input,select,textarea{
  width:100%; min-width:0; max-width:100%;
  padding:13px 14px; border:1px solid var(--line-2); border-radius:var(--r-sm);
  background:var(--card-2); color:var(--fg);
  font-family:inherit; font-size:16px; /* 16px 才不會讓 iOS 自動放大 */
}
/* iOS Safari 的日期欄位有自己的最小寬度，放進 flex 容器會把整個版面撐破。
   關掉原生外觀並強制縮到容器內，欄位才不會超出畫面右緣。 */
input[type="date"]{
  -webkit-appearance:none; appearance:none;
  display:block; text-align:left;
}
textarea{resize:vertical; min-height:70px; line-height:1.5}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:rgba(255,111,145,.55); background:var(--card-3);
  box-shadow:0 0 0 3px rgba(255,111,145,.1);
}
.row{display:flex; gap:10px}
.row>*{flex:1; min-width:0}
button.btn{
  border:0; background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
  padding:14px 18px; border-radius:var(--r-sm); font-family:inherit;
  font-size:15px; font-weight:700; cursor:pointer; width:100%;
  box-shadow:0 6px 20px rgba(255,111,145,.22);
}
button.btn:active{transform:scale(.985)}
button.ghost{background:none; color:var(--fg); border:1px solid var(--line-2); box-shadow:none}
button.danger{background:none; color:var(--err); border:1px solid rgba(255,122,122,.32); box-shadow:none}
.tools{display:flex; gap:9px; margin-top:16px}
.tools .btn{flex:1}

/* ---------- 搜尋列 / 分段控制 ---------- */
.searchbar{display:flex; gap:9px; margin-bottom:11px}
.searchbar input{background:var(--card); border-radius:99px; padding-left:18px}
.searchbar .go{
  flex:0 0 auto; width:52px; border:0; border-radius:99px; color:#fff; font-size:17px; cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
}
.seg{display:flex; gap:4px; background:var(--card); border:1px solid var(--line);
     padding:4px; border-radius:99px; margin-bottom:12px}
.seg button{
  flex:1; border:0; background:none; color:var(--muted); font-family:inherit;
  font-size:13px; font-weight:600; padding:9px 4px; border-radius:99px; cursor:pointer; transition:.15s;
}
.seg button.on{background:var(--card-3); color:var(--fg); box-shadow:0 2px 8px rgba(0,0,0,.4)}
.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{
  white-space:nowrap; border:1px solid var(--line-2); background:var(--card); color:var(--muted);
  padding:8px 14px; border-radius:99px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
}
.chips button.on{background:var(--accent-soft); color:var(--accent); border-color:rgba(255,111,145,.4)}

/* ---------- 想吃清單卡片 ---------- */
.food{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:15px; margin-bottom:10px;
}
.food.done{opacity:.5}
.food .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; padding:0; background:none; position:static}
.food .name{margin:0; font-size:17px; font-weight:700; letter-spacing:-.2px; line-height:1.3}
.food.done .name{text-decoration:line-through}
.food .meta{margin:7px 0 0; font-size:12.5px; color:var(--muted)}
.food .note{
  margin:11px 0 0; font-size:13px; color:var(--muted); white-space:pre-wrap; line-height:1.55;
  padding-left:11px; border-left:2px solid var(--line-2);
}
.food .stars{margin:8px 0 0; font-size:13px; color:var(--gold); letter-spacing:2px}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
.tag{background:var(--card-3); color:var(--muted); font-size:11.5px; padding:4px 10px; border-radius:99px}
.acts{display:flex; flex-wrap:nowrap; gap:7px; margin-top:14px;
  overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.acts::-webkit-scrollbar{display:none}
.acts button{flex:0 0 auto}
.acts button.del{color:var(--muted-2); border-color:var(--line)}
.acts button{
  border:1px solid var(--line-2); background:var(--card-2); color:var(--fg);
  padding:9px 13px; border-radius:11px; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer;
}
.acts button:active{background:var(--card-3)}
.acts button.p{border-color:rgba(255,111,145,.4); color:var(--accent); background:var(--accent-soft)}
.by{margin:12px 0 0; font-size:11px; color:var(--muted-2)}
.empty{text-align:center; color:var(--muted-2); padding:56px 20px; font-size:14px; line-height:1.7}

/* ---------- 地圖 ---------- */
#mapFrame{
  width:100%; height:min(58vh,520px); min-height:300px; border:0;
  border-radius:var(--r); background:var(--card); display:block; margin-top:2px;
}
.hint{font-size:12px; color:var(--muted-2); line-height:1.7; margin:12px 2px 0}
.duo{display:flex; gap:9px; margin-bottom:12px}
.duo button{
  flex:1; border:1px solid var(--line-2); background:var(--card); color:var(--fg);
  padding:12px; border-radius:var(--r-sm); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
}

/* ---------- 底部導覽 ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; padding:8px 8px calc(8px + var(--safe-b));
  background:rgba(14,11,17,.88);
  backdrop-filter:blur(22px) saturate(1.4); -webkit-backdrop-filter:blur(22px) saturate(1.4);
  border-top:1px solid var(--line);
}
.tabbar button{
  flex:1; border:0; background:none; color:var(--muted-2); font-family:inherit;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:7px 2px; font-size:10.5px; font-weight:600; cursor:pointer; transition:color .15s;
}
.tabbar svg{width:23px; height:23px; fill:none; stroke:currentColor;
  stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.tabbar button.on{color:var(--accent)}
.tabbar button.on svg{filter:drop-shadow(0 0 8px rgba(255,111,145,.5))}

/* ---------- 浮動新增鈕 ---------- */
.fab{
  position:fixed; right:18px; bottom:calc(var(--nav-h) + var(--safe-b) + 16px); z-index:41;
  width:56px; height:56px; border:0; border-radius:50%; cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff;
  font-size:30px; font-weight:300; line-height:1;
  display:none; align-items:center; justify-content:center;
  box-shadow:0 10px 28px rgba(255,111,145,.4);
}
.fab:active{transform:scale(.93)}

/* ---------- 底部彈出表單 ---------- */
.scrim{
  position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.65);
  backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .25s;
}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:51;
  max-height:90dvh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg-soft); border-top:1px solid var(--line-2);
  border-radius:26px 26px 0 0;
  padding:10px 18px calc(24px + var(--safe-b));
  transform:translateY(101%); transition:transform .3s cubic-bezier(.32,.72,0,1);
}
.sheet.on{transform:none}
.grab{width:38px; height:4px; border-radius:99px; background:var(--line-2); margin:2px auto 14px}
.sheet h3{margin:0 0 4px; font-size:19px; font-weight:700}
.sheet .lead{margin:0; font-size:12.5px; color:var(--muted-2)}

/* ---------- 設定列表 ---------- */
.rows{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.rows .item{display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 16px; border-bottom:1px solid var(--line)}
.rows .item:last-child{border-bottom:0}
.rows .item b{font-weight:600; font-size:14px}
.rows .item span{font-size:12.5px; color:var(--muted-2)}
.stack{display:flex; flex-direction:column; gap:9px; margin-top:16px}

/* ---------- 提示訊息 ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(var(--nav-h) + var(--safe-b) + 26px); z-index:60;
  transform:translate(-50%,14px); opacity:0; pointer-events:none; transition:.25s;
  background:var(--card-3); color:var(--fg); border:1px solid var(--line-2);
  padding:12px 18px; border-radius:99px; font-size:13.5px; font-weight:600;
  box-shadow:0 10px 34px rgba(0,0,0,.6); max-width:86vw; text-align:center;
}
#toast.on{opacity:1; transform:translate(-50%,0)}

@media (min-width:640px){
  body{max-width:620px; margin:0 auto}
  .tabbar{left:50%; transform:translateX(-50%); max-width:620px; border-radius:20px 20px 0 0}
  .sheet{left:50%; transform:translateX(-50%) translateY(101%); max-width:620px}
  .sheet.on{transform:translateX(-50%)}
  .fab{right:calc(50vw - 292px)}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span class="dot"></span>我們的小天地</div>
  <button id="syncBadge" onclick="syncNow(false)">尚未設定同步</button>
</header>

<main>
  <!-- ============ 我們 ============ -->
  <section id="us" class="on">
    <div class="hero">
      <div class="glow"></div>
      <div class="faces">
        <div class="face" onclick="pickAvatar('a1')"><div class="ava"><div id="av1"></div><div class="edit">✎</div></div><p id="nm1"></p></div>
        <div class="heart">♥</div>
        <div class="face" onclick="pickAvatar('a2')"><div class="ava"><div id="av2"></div><div class="edit">✎</div></div><p id="nm2"></p></div>
      </div>
      <div id="dayBox" class="bigday"></div>
      <div id="daySub" class="sub"></div>
    </div>
    <div class="card"><p class="h2">即將到來的日子</p><div id="msList"></div></div>
    <div class="card" style="background:none;border:0;padding:0">
      <p class="h2" style="padding:0 4px">我們的紀錄</p><div id="stats"></div>
    </div>
  </section>

  <!-- ============ 想吃清單 ============ -->
  <section id="food">
    <div class="searchbar">
      <input id="q" placeholder="搜尋店名、地點、標籤" oninput="renderFoods()">
    </div>
    <div class="seg" id="statusSeg">
      <button class="on" onclick="setStat(this,'todo')">想吃的</button>
      <button onclick="setStat(this,'done')">吃過了</button>
      <button onclick="setStat(this,'all')">全部</button>
    </div>
    <select id="fstat" onchange="renderFoods()" style="display:none">
      <option value="todo">想吃的</option><option value="done">吃過了</option><option value="all">全部</option>
    </select>
    <div id="tagbar" class="chips"></div>
    <div id="foodList"></div>
  </section>

  <!-- ============ 地圖 ============ -->
  <section id="map">
    <div class="searchbar">
      <input id="mq" placeholder="輸入店名或地址" onkeydown="if(event.key==='Enter')doMap()">
      <button class="go" onclick="doMap()">↗</button>
    </div>
    <div class="duo">
      <button onclick="nearMe()">搜我附近</button>
      <button onclick="openMaps(document.getElementById('mq').value)">用地圖 App 開啟</button>
    </div>
    <div id="mapChips" class="chips"></div>
    <iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    <p class="hint">點清單裡的店名可直接定位。要導航就按「用地圖 App 開啟」，手機會跳到 Google 地圖。</p>
  </section>

  <!-- ============ 設定 ============ -->
  <section id="set">
    <p class="h2" style="padding:0 4px">這台裝置是誰在用</p>
    <div class="seg" style="margin-bottom:20px">
      <button id="who1" onclick="setMe(1)"></button>
      <button id="who2" onclick="setMe(2)"></button>
    </div>

    <p class="h2" style="padding:0 4px">同步</p>
    <div class="card" id="syncCard">
      <div id="hostedNote" style="display:none">
        <p class="lead" style="margin-bottom:14px">這個頁面是從你們的 Google Apps Script 開的，會自動同步，不用設定任何東西。</p>
        <button class="btn ghost" onclick="syncNow(false)">立即同步</button>
        <p id="syncMsg2" class="hint"></p>
      </div>
      <div id="manualSync">
        <label>同步網址（Apps Script 的 /exec 網址）</label>
        <input id="s_url" placeholder="https://script.google.com/macros/s/…/exec">
        <label>同步密碼（要和 Code.gs 裡的 PASS 一樣）</label>
        <input id="s_pass" placeholder="••••••••">
        <div class="tools">
          <button class="btn" onclick="saveSync()">儲存並連線</button>
          <button class="btn ghost" onclick="syncNow(false)">立即同步</button>
        </div>
        <p id="syncMsg" class="hint"></p>
      </div>
    </div>

    <p class="h2" style="padding:0 4px">我們的資料</p>
    <div class="card">
      <div class="row">
        <div><label>暱稱 1</label><input id="s_n1"></div>
        <div><label>暱稱 2</label><input id="s_n2"></div>
      </div>
      <label>在一起的第一天</label><input id="s_start" type="date">
      <div class="row">
        <div><label>生日 1</label><input id="s_b1" type="date"></div>
        <div><label>生日 2</label><input id="s_b2" type="date"></div>
      </div>
      <div class="tools"><button class="btn" onclick="saveSettings()">儲存</button></div>
    </div>

    <p class="h2" style="padding:0 4px">備份與重設</p>
    <div class="card">
      <p class="lead">有同步的話兩台裝置會自動一致，這裡的匯出只是額外的離線備份。</p>
      <div class="stack">
        <button class="btn ghost" onclick="exportData()">匯出備份</button>
        <button class="btn ghost" onclick="document.getElementById('impFile').click()">匯入備份</button>
        <button class="btn danger" onclick="wipe()">清除這台裝置</button>
      </div>
      <input type="file" id="impFile" accept="application/json" style="display:none" onchange="importData(this)">
    </div>
  </section>
</main>

<button class="fab" id="fab" onclick="openSheet()" aria-label="新增想吃的">＋</button>

<nav class="tabbar">
  <button data-t="us" class="on">

<script>
/* =================================================================
   資料層
   - couple 每個欄位都有自己的 updatedAt（存在 S.cu），逐欄位合併
   - foods 每筆都有 updatedAt + deleted（墓碑），逐筆合併
   - 兩邊都是「誰比較新誰贏」，所以整包推上去也不會蓋掉對方的新資料
   ================================================================= */
var KEY = 'couple_app_v2';
var DEF = {
  couple:{ n1:'冠廷', n2:'育庭', a1:'', a2:'', start:'2026-09-02', b1:'', b2:'' },
  cu:{},                                   // couple 各欄位的 updatedAt
  foods:[],
  me:1,                                    // 這台裝置是誰
  sync:{ url:'', pass:'', seq:0, lastAt:0, ok:false }
};
var S = load();
var applying = false;                       // 正在套用伺服器資料，避免無限回圈

function load(){
  try{
    var o = JSON.parse(localStorage.getItem(KEY) || '{}');
    return {
      couple: Object.assign({}, DEF.couple, o.couple||{}),
      cu: o.cu || {},
      foods: Array.isArray(o.foods) ? o.foods : [],
      me: o.me || 1,
      sync: Object.assign({}, DEF.sync, o.sync||{})
    };
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
function save(quiet){
  // 無痕視窗、第三方 iframe 等情況會讓 localStorage 直接丟例外。
  // 存不進去不該讓整個 App 停擺——資料還在記憶體裡，雲端也有。
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(!quiet && !applying) queueSync();
}
function touch(k, v){ S.couple[k] = v; S.cu[k] = Date.now(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function jq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
var DAY = 86400000;
function today(){ var t=new Date(); t.setHours(0,0,0,0); return t; }
function d(s){ return s ? new Date(s+'T00:00:00') : null; }
function fmt(dt){ return dt.getFullYear()+'/'+String(dt.getMonth()+1).padStart(2,'0')+'/'+String(dt.getDate()).padStart(2,'0'); }
function hm(ts){ var t=new Date(ts); return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); }
function nameOf(n){ return (n===2 ? S.couple.n2 : S.couple.n1) || (n===2?'她':'我'); }
function liveFoods(){ return S.foods.filter(function(f){ return !f.deleted; }); }

/* ================= 同步 ================= */
// 這支 App 有兩種跑法：
//  (A) 由 GAS 專案發出來的網頁 → 有 google.script.run，直接呼叫後端，免網址免密碼免 CORS
//  (B) 本機 / 別的空間開的 index.html → 用 fetch 打 /exec，要自己填網址和密碼
function hosted(){ return !!(window.google && window.google.script && window.google.script.run); }
function syncReady(){ return hosted() || !!S.sync.url; }
function callSync(payload){
  if(hosted()){
    return new Promise(function(res, rej){
      google.script.run
        .withSuccessHandler(function(txt){
          try{ res(JSON.parse(txt)); }catch(e){ rej(new Error('伺服器回應解析失敗')); }
        })
        .withFailureHandler(function(err){ rej(new Error((err && err.message) || String(err))); })
        .apiSync(JSON.stringify(payload));
    });
  }
  // 不設 Content-Type → 瀏覽器送 text/plain，屬於簡單請求，不會觸發 CORS 預檢
  function once(){
    return fetch(S.sync.url, { method:'POST', body: JSON.stringify(payload), redirect:'follow' })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        try{ return JSON.parse(txt); }
        catch(e){
          // Apps Script 會把 POST 轉址到 script.googleusercontent.com 取回應，
          // 那一段偶爾會回 404 的 HTML 錯誤頁（實測回應時間 2～23 秒之間跳動）。
          // 這是 Google 端的不穩定，不是網址或權限設錯。
          var e2 = new Error('伺服器回了錯誤頁');
          e2.retryable = true;
          throw e2;
        }
      }, function(netErr){
        // fetch 直接失敗：斷線、逾時、行動網路不穩。
        // Safari 這裡只會給一句 "Load failed"，看不出原因，所以一律當成可重試。
        var e3 = new Error('連不到伺服器');
        e3.retryable = true;
        e3.detail = String((netErr && netErr.message) || netErr);
        throw e3;
      });
  }
  var tries = 0;
  function attempt(){
    tries++;
    return once().catch(function(err){
      // 同步是冪等的（每個欄位各自帶 updatedAt、下載靠伺服器 seq），重送不會弄壞資料
      if(err.retryable && tries < 4){
        return new Promise(function(res){ setTimeout(res, tries * 2000); }).then(attempt);
      }
      if(err.retryable){
        throw new Error(err.message + '（已重試 ' + tries + ' 次）'
          + (err.detail ? '：' + err.detail : '') + '。稍後會自動再試一次。');
      }
      throw err;
    });
  }
  return attempt();
}

var syncTimer = null;
function queueSync(){
  if(!syncReady()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(function(){ syncNow(true); }, 1200);
}
function msg(t){
  ['syncMsg','syncMsg2'].forEach(function(id){
    var e = document.getElementById(id); if(e) e.textContent = t;
  });
}
function badge(state, text){
  var b = document.getElementById('syncBadge');
  b.className = state || '';
  b.textContent = text;
}
var syncing = false, pendingSync = false;
function syncNow(silent){
  if(!syncReady()){ badge('', '尚未設定同步'); if(!silent) toast('請先到「設定 → 同步」填入網址'); return Promise.resolve(); }
  if(syncing){ pendingSync = true; return Promise.resolve(); }
  syncing = true;
  badge('busy', '同步中…');

  // 只推「上次同步之後才改過的」東西，避免每次都重傳大頭貼
  var since = S.sync.lastAt || 0;
  var pc = {};
  Object.keys(S.couple).forEach(function(k){
    var u = S.cu[k] || 0;
    if(u > since) pc[k] = { v: S.couple[k], u: u };
  });
  var pf = S.foods.filter(function(f){ return (f.updatedAt||0) > since; });

  var t0 = Date.now();
  return callSync({ action:'sync', pass:S.sync.pass, sinceSeq:S.sync.seq||0, push:{ couple:pc, foods:pf } })
    .then(function(j){
      if(!j || !j.ok) throw new Error((j && j.error) || '未知錯誤');
      applyRemote(j);
      S.sync.seq = j.seq || 0;
      S.sync.lastAt = t0;
      S.sync.ok = true;
      save(true);
      badge('ok', '已同步 ' + hm(Date.now()));
      msg('✅ 上次同步 ' + hm(Date.now()) + '（序號 ' + S.sync.seq + '）');
    })
    .catch(function(err){
      S.sync.ok = false; save(true);
      badge('err', '同步失敗');
      msg('⚠️ ' + err.message);
      if(!silent) toast('同步失敗：' + err.message);
    })
    .then(function(){
      syncing = false;
      if(pendingSync){ pendingSync = false; setTimeout(function(){ syncNow(true); }, 60); }
    });
}
function applyRemote(j){
  applying = true;
  var changed = false;
  var rc = j.couple || {};
  Object.keys(rc).forEach(function(k){
    var it = rc[k], u = Number(it.u)||0;
    if(u >= (S.cu[k]||0) && it.v !== undefined && it.v !== null){
      if(S.couple[k] !== it.v){ S.couple[k] = it.v; changed = true; }
      S.cu[k] = u;
    }
  });
  var byId = {};
  S.foods.forEach(function(f){ byId[f.id] = f; });
  (j.foods || []).forEach(function(sf){
    if(!sf || !sf.id) return;
    var lf = byId[sf.id];
    if(!lf || (Number(sf.updatedAt)||0) > (Number(lf.updatedAt)||0)){ byId[sf.id] = sf; changed = true; }
  });
  S.foods = Object.keys(byId).map(function(k){ return byId[k]; });
  applying = false;
  if(changed){ fillSettings(); renderUs(); renderFoods(); renderMapChips(); }
}
function saveSync(){
  S.sync.url = document.getElementById('s_url').value.trim();
  S.sync.pass = document.getElementById('s_pass').value.trim();
  S.sync.seq = 0;                       // 換後端就整包重抓
  S.sync.lastAt = 0;
  save(true);
  return syncNow(false);
}

/* ================= 分頁 ================= */
document.querySelectorAll('.tabbar button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.tabbar button').forEach(function(x){ x.classList.remove('on'); });
    document.querySelectorAll('section').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    document.getElementById(b.dataset.t).classList.add('on');
    if(b.dataset.t==='map') renderMapChips();
    document.getElementById('fab').style.display = (b.dataset.t==='food') ? 'flex' : 'none';
    closeSheet();
    window.scrollTo({top:0});
  };
});

/* ================= 我們 ================= */
function renderUs(){
  var c = S.couple;
  document.getElementById('av1').outerHTML = c.a1 ? '<img id="av1" src="'+c.a1+'" alt="">' : '<div id="av1" class="ph">👤</div>';
  document.getElementById('av2').outerHTML = c.a2 ? '<img id="av2" src="'+c.a2+'" alt="">' : '<div id="av2" class="ph">👤</div>';
  document.getElementById('nm1').textContent = c.n1 || '我';
  document.getElementById('nm2').textContent = c.n2 || '她';

  var box = document.getElementById('dayBox'), sub = document.getElementById('daySub');
  if(!c.start){
    box.innerHTML = '<b>—</b>還沒設定在一起的日子';
    sub.textContent = '到「設定」填上第一天就會開始數囉 ✨';
  }else{
    var s = d(c.start);
    var n = Math.floor((today()-s)/DAY) + 1;
    box.innerHTML = '在一起第 <b>'+n+'</b> 天';
    // 未滿一個月時再顯示「已經 X 天」會和「第 N 天」看起來打架，所以省略
    sub.textContent = '從 '+fmt(s)+' 開始' + (n>31 ? ' · '+ymd(s) : '');
  }
  renderMilestones();
  renderStats();
}
function ymd(s){
  var t = today(), y = t.getFullYear()-s.getFullYear(), m = t.getMonth()-s.getMonth(), dd = t.getDate()-s.getDate();
  if(dd<0){ m--; dd += new Date(t.getFullYear(), t.getMonth(), 0).getDate(); }
  if(m<0){ y--; m+=12; }
  var out = [];
  if(y) out.push(y+' 年');
  if(m) out.push(m+' 個月');
  out.push(dd+' 天');
  return '已經 ' + out.join(' ');
}
function renderMilestones(){
  var c = S.couple, list = [], t = today();
  if(c.start){
    var s = d(c.start);
    var marks = {};
    [7,30,50,100,150,200,250,300,365,400,500,520,600,700,730,800,900,1000,1100,1200,1314,1400,1500].forEach(function(n){ marks[n]=1; });
    for(var y=1;y<=30;y++) marks[y*365]=1;
    Object.keys(marks).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){
      var dt = new Date(s.getTime() + (n-1)*DAY);
      if(dt >= t) list.push({ t: (n%365===0) ? (n/365)+' 週年 💐' : '第 '+n+' 天', dt: dt });
    });
    var mm = new Date(t.getFullYear(), t.getMonth(), s.getDate());
    if(mm < t) mm = new Date(t.getFullYear(), t.getMonth()+1, s.getDate());
    list.push({ t:'每月紀念日', dt: mm });
  }
  [['b1', nameOf(1)], ['b2', nameOf(2)]].forEach(function(p){
    if(!c[p[0]]) return;
    var b = d(c[p[0]]);
    var nx = new Date(t.getFullYear(), b.getMonth(), b.getDate());
    if(nx < t) nx = new Date(t.getFullYear()+1, b.getMonth(), b.getDate());
    list.push({ t: p[1]+'的生日 🎂', dt: nx });
  });
  list.sort(function(a,b){ return a.dt-b.dt; });
  var top = list.slice(0,5);
  document.getElementById('msList').innerHTML = top.length ? top.map(function(x){
    var left = Math.round((x.dt - t)/DAY);
    return '<div class="ms"><div><div>'+esc(x.t)+'</div><div class="d">'+fmt(x.dt)+'</div></div>'+
           '<span class="pill">'+(left===0?'就是今天！':'還有 '+left+' 天')+'</span></div>';
  }).join('') : '<div class="empty">填好日期後這裡會自動倒數 🗓️</div>';
}
function renderStats(){
  var live = liveFoods();
  var done = live.filter(function(f){ return f.status==='done'; });
  var rated = done.filter(function(f){ return f.rating>0; });
  var avg = rated.length ? (rated.reduce(function(a,b){ return a+b.rating; },0)/rated.length).toFixed(1) : '—';
  document.getElementById('stats').innerHTML =
    '<div class="ms"><div>想吃的口袋名單</div><span class="pill">'+(live.length-done.length)+' 家</span></div>'+
    '<div class="ms"><div>一起吃過的</div><span class="pill">'+done.length+' 家</span></div>'+
    '<div class="ms"><div>平均評分</div><span class="pill">'+avg+' / 5</span></div>';
}
function pickAvatar(which){
  var inp = document.createElement('input');
  inp.type='file'; inp.accept='image/*';
  inp.onchange = function(){
    var f = inp.files[0]; if(!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      var img = new Image();
      img.onload = function(){
        touch(which, compress(img));
        save(); renderUs();
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}
// Google 試算表單一儲存格上限 5 萬字元，壓到 4 萬字以下才安全
function compress(img){
  var plans = [[320,.82],[288,.75],[256,.7],[224,.6],[192,.5],[160,.45]];
  var url = '';
  for(var i=0;i<plans.length;i++){
    url = draw(img, plans[i][0], plans[i][1]);
    if(url.length < 40000) return url;
  }
  return url;
}
function draw(img, size, q){
  var cv = document.createElement('canvas'); cv.width = cv.height = size;
  var x = cv.getContext('2d'), m = Math.min(img.width, img.height);
  x.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, size, size);
  return cv.toDataURL('image/jpeg', q);
}

/* ================= 想吃清單 ================= */
var tagFilter = '';
function addFood(){
  var name = document.getElementById('f_name').value.trim();
  if(!name){ toast('至少要有店名或想吃的東西'); return; }
  var url = document.getElementById('f_url').value.trim();
  var m = url.match(/https?:\/\/[^\s"'<>]+/);     // 貼整段文字也能抓出網址
  url = m ? m[0] : url;
  var now = Date.now();
  S.foods.unshift({
    id: 'f'+now+'_'+Math.floor(Math.random()*10000),
    name: name,
    area: document.getElementById('f_area').value.trim(),
    url: url,
    want: +document.getElementById('f_want').value,
    price: document.getElementById('f_price').value,
    tags: document.getElementById('f_tags').value.split(/[,，、]/).map(function(s){ return s.trim(); }).filter(Boolean),
    note: document.getElementById('f_note').value.trim(),
    status:'todo', rating:0, by:S.me, addedAt:now, doneAt:0,
    updatedAt: now, deleted:false
  });
  save(); clearForm(); closeSheet(); toast('已加入清單 ✓'); renderFoods();
}
function clearForm(){
  ['f_name','f_area','f_url','f_tags','f_note'].forEach(function(i){ document.getElementById(i).value=''; });
  document.getElementById('f_want').value='3'; document.getElementById('f_price').value='';
}
function renderFoods(){
  var q = document.getElementById('q').value.trim().toLowerCase();
  var st = document.getElementById('fstat').value;
  var list = liveFoods().filter(function(f){
    if(st!=='all' && (f.status||'todo')!==st) return false;
    if(tagFilter && (f.tags||[]).indexOf(tagFilter)<0) return false;
    if(q && [f.name,f.area,(f.tags||[]).join(' ')].join(' ').toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  list.sort(function(a,b){ return (b.want-a.want) || (b.addedAt-a.addedAt); });

  var tags = [];
  liveFoods().forEach(function(f){ (f.tags||[]).forEach(function(t){ if(tags.indexOf(t)<0) tags.push(t); }); });
  document.getElementById('tagbar').innerHTML = tags.length
    ? '<button class="'+(tagFilter?'':'on')+'" onclick="setTag(\'\')">全部</button>' +
      tags.map(function(t){ return '<button class="'+(tagFilter===t?'on':'')+'" onclick="setTag(\''+jq(t)+'\')">'+esc(t)+'</button>'; }).join('')
    : '';

  document.getElementById('foodList').innerHTML = list.length ? list.map(function(f){
    var fire = f.want===5 ? '超想吃' : (f.want===3 ? '想吃' : '隨緣');
    var q2 = jq((f.area? f.area+' ':'') + f.name);
    return '<div class="food '+(f.status==='done'?'done':'')+'">'+
      '<div class="top"><p class="name">'+esc(f.name)+'</p><span class="pill">'+fire+'</span></div>'+
      '<p class="meta">'+ [f.area?'📍 '+esc(f.area):'', f.price?esc(f.price):'',
          f.status==='done'? '吃過了 '+(f.doneAt? fmt(new Date(f.doneAt)) : '') : ''].filter(Boolean).join('  ·  ') +'</p>'+
      (f.status==='done' && f.rating ? '<p class="stars">'+'★'.repeat(f.rating)+'☆'.repeat(5-f.rating)+'</p>' : '')+
      (f.note? '<p class="note">'+esc(f.note)+'</p>' : '')+
      ((f.tags||[]).length? '<div class="tags">'+f.tags.map(function(t){ return '<span class="tag">#'+esc(t)+'</span>'; }).join('')+'</div>' : '')+
      '<div class="acts">'+
        '<button class="p" onclick="showOnMap(\''+q2+'\')">地圖</button>'+
        '<button onclick="openMaps(\''+q2+'\')">導航</button>'+
        (f.url? '<button onclick="window.open(\''+jq(f.url)+'\',\'_blank\')">原文</button>' : '')+
        (f.status==='done'
          ? '<button onclick="undone(\''+f.id+'\')">放回想吃</button>'
          : '<button onclick="markDone(\''+f.id+'\')">吃過了</button>')+
        '<button class="del" onclick="del(\''+f.id+'\')">刪除</button>'+
      '</div>'+
      '<p class="by">'+esc(nameOf(f.by||1))+' 加的 · '+fmt(new Date(f.addedAt))+'</p>'+
      '</div>';
  }).join('') : '<div class="empty">'+(liveFoods().length? '沒有符合的項目 🔍':'還沒有東西，用上面的表單加第一家吧 🍰')+'</div>';
  renderStats();
}
function setTag(t){ tagFilter = t; renderFoods(); }
function findFood(id){ for(var i=0;i<S.foods.length;i++) if(S.foods[i].id===id) return S.foods[i]; return null; }
function markDone(id){
  var f = findFood(id); if(!f) return;
  var r = prompt('一起吃過了！給幾顆星？(1-5，可留空)', '5');
  if(r===null) return;
  f.status='done'; f.doneAt=Date.now(); f.rating = Math.min(5, Math.max(0, parseInt(r)||0));
  f.updatedAt = Date.now();
  save(); renderFoods();
}
function undone(id){
  var f = findFood(id); if(!f) return;
  f.status='todo'; f.doneAt=0; f.updatedAt = Date.now();
  save(); renderFoods();
}
function del(id){
  if(!confirm('確定刪除？（兩台裝置都會刪掉）')) return;
  var f = findFood(id); if(!f) return;
  f.deleted = true; f.updatedAt = Date.now();
  save(); renderFoods(); renderMapChips();
}

/* ================= 地圖 ================= */
function mapSrc(q, ll){
  var u = 'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&z=15&hl=zh-TW&output=embed';
  if(ll) u = 'https://maps.google.com/maps?q='+encodeURIComponent(q)+'&ll='+ll+'&z=14&hl=zh-TW&output=embed';
  return u;
}
function doMap(){
  var q = document.getElementById('mq').value.trim();
  if(!q) return;
  document.getElementById('mapFrame').src = mapSrc(q);
}
function showOnMap(q){
  document.querySelector('.tabbar button[data-t="map"]').click();
  document.getElementById('mq').value = q;
  doMap();
}
function openMaps(q){
  if(!q || !q.trim()) return;
  window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q), '_blank');
}
function nearMe(){
  var q = document.getElementById('mq').value.trim() || '美食';
  if(!navigator.geolocation){ toast('這個瀏覽器不支援定位'); return; }
  navigator.geolocation.getCurrentPosition(function(p){
    var ll = p.coords.latitude.toFixed(6)+','+p.coords.longitude.toFixed(6);
    document.getElementById('mapFrame').src = mapSrc(q, ll);
  }, function(){ toast('拿不到定位，請確認有允許位置權限'); });
}
function renderMapChips(){
  var todo = liveFoods().filter(function(f){ return f.status!=='done'; }).slice(0,20);
  document.getElementById('mapChips').innerHTML = todo.length
    ? todo.map(function(f){
        var q = jq((f.area? f.area+' ':'')+f.name);
        return '<button onclick="document.getElementById(\'mq\').value=\''+q+'\';doMap()">'+esc(f.name)+'</button>';
      }).join('')
    : '<span class="hint">清單裡有店家時，這裡會出現快速定位按鈕</span>';
}

/* ================= 設定 ================= */
function fillSettings(){
  var c = S.couple;
  document.getElementById('s_n1').value = c.n1||'';
  document.getElementById('s_n2').value = c.n2||'';
  document.getElementById('s_start').value = c.start||'';
  document.getElementById('s_b1').value = c.b1||'';
  document.getElementById('s_b2').value = c.b2||'';
  document.getElementById('s_url').value = S.sync.url||'';
  document.getElementById('s_pass').value = S.sync.pass||'';
  document.getElementById('who1').textContent = '我是 '+(c.n1||'我');
  document.getElementById('who2').textContent = '我是 '+(c.n2||'她');
  document.getElementById('hostedNote').style.display = hosted() ? '' : 'none';
  document.getElementById('manualSync').style.display = hosted() ? 'none' : '';
  document.getElementById('who1').className = S.me===1?'on':'';
  document.getElementById('who2').className = S.me===2?'on':'';
}
function setMe(n){ S.me = n; save(true); fillSettings(); renderFoods(); }
function saveSettings(){
  var g = function(id){ return document.getElementById(id).value; };
  if(S.couple.n1 !== (g('s_n1').trim()||'我')) touch('n1', g('s_n1').trim()||'我');
  if(S.couple.n2 !== (g('s_n2').trim()||'她')) touch('n2', g('s_n2').trim()||'她');
  if(S.couple.start !== g('s_start')) touch('start', g('s_start'));
  if(S.couple.b1 !== g('s_b1')) touch('b1', g('s_b1'));
  if(S.couple.b2 !== g('s_b2')) touch('b2', g('s_b2'));
  save(); fillSettings(); renderUs(); toast('儲存好了 ✓');
}
function exportData(){
  var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'couple-backup-'+fmt(today()).replace(/\//g,'')+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}
function importData(inp){
  var f = inp.files[0]; if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var o = JSON.parse(fr.result);
      if(!o.couple && !o.foods) throw 0;
      if(!confirm('匯入會覆蓋這台裝置目前的資料，確定嗎？')) return;
      S = {
        couple: Object.assign({}, DEF.couple, o.couple||{}),
        cu: o.cu||{}, foods: Array.isArray(o.foods)?o.foods:[], me: o.me||1,
        sync: Object.assign({}, DEF.sync, o.sync||{})
      };
      save(true); fillSettings(); renderUs(); renderFoods(); toast('匯入完成 ✓');
    }catch(e){ toast('檔案格式不對'); }
    inp.value='';
  };
  fr.readAsText(f);
}
function wipe(){
  if(!confirm('會清掉這台裝置的資料。雲端上的還在，下次同步會再抓回來。確定？')) return;
  localStorage.removeItem(KEY);
  S = JSON.parse(JSON.stringify(DEF));
  fillSettings(); renderUs(); renderFoods();
}


/* ================= 手機介面元件 ================= */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2600);
}
function openSheet(){
  document.getElementById('scrim').classList.add('on');
  document.getElementById('sheet').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closeSheet(){
  var s = document.getElementById('sheet');
  if(!s || !s.classList.contains('on')) return;
  document.getElementById('scrim').classList.remove('on');
  s.classList.remove('on');
  document.body.style.overflow = '';
}
// 分段控制對應到隱藏的 select，這樣清單篩選邏輯完全不用改
function setStat(el, v){
  var kids = el.parentNode.children;
  for(var i=0;i<kids.length;i++) kids[i].classList.remove('on');
  el.classList.add('on');
  document.getElementById('fstat').value = v;
  renderFoods();
}

/* ================= 啟動 ================= */
(function(){
  if(!location.hash || location.hash.length < 2) return;
  var q = {};
  location.hash.slice(1).split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if(i > 0) q[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
  });

  // 被外框頁用 iframe 包起來時，這裡讀不到 env(safe-area-inset-*)（永遠是 0），
  // 所以改由外框頁量好再用 #st= / #sb= 傳進來，避免導覽列壓到 home indicator。
  if(q.st) document.documentElement.style.setProperty('--safe-t', parseInt(q.st, 10) + 'px');
  if(q.sb) document.documentElement.style.setProperty('--safe-b', parseInt(q.sb, 10) + 'px');

  // 直接開啟（非 iframe）時，同步設定可以用 #u= / #p= 帶進來，
  // 這樣就不必把網址和密碼寫死在公開的原始碼裡。
  if(!q.u) return;
  S.sync.url = q.u;
  S.sync.pass = q.p || '';
  S.sync.seq = 0; S.sync.lastAt = 0;
  save(true);
})();
fillSettings(); renderUs(); renderFoods(); renderMapChips();
if(syncReady()){ badge('', '準備同步…'); syncNow(true); }
setInterval(function(){ if(syncReady()) syncNow(true); }, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden && syncReady()) syncNow(true); });
window.addEventListener('focus', function(){ if(syncReady()) syncNow(true); });
</script>
</body>
