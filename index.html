<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小天地">
<meta name="theme-color" content="#0b090d">
<title>我們的小天地</title>
<style>
  html,body{margin:0;height:100%;background:#0b090d;overflow:hidden}
  /* iframe 內部讀不到 env(safe-area-inset-*)，所以由外框頁把安全區讓出來，
     裡面的底部導覽列才不會壓到 iPhone 的 home indicator */
  body{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  iframe{border:0;width:100%;height:100%;display:block;background:#0b090d}
  #msg{
    color:#9d92a4;text-align:center;padding:64px 26px;
    font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  }
  #msg b{display:block;color:#f4ecf3;font-size:17px;margin-bottom:10px}
  #msg code{
    display:block;word-break:break-all;margin-top:14px;padding:12px 14px;
    background:#17131c;border:1px solid rgba(255,255,255,.1);border-radius:12px;
    color:#ff6f91;font-size:12px;text-align:left;
  }
  .dot{
    width:9px;height:9px;border-radius:50%;margin:0 auto 18px;
    background:linear-gradient(135deg,#ff6f91,#c78bff);
    box-shadow:0 0 14px rgba(255,111,145,.7);
    animation:pulse 1.4s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
</style>
</head>
<body>
<div id="msg"><div class="dot"></div>載入中…</div>
<script>
/*
  外框頁。
  真正的 App 由 Apps Script 發出，這裡只是用 iframe 把它包起來，目的有二：
   1. Google 那條「這個應用程式是由 Apps Script 的使用者建立」公告只會出現在
      最上層頁面，被 iframe 嵌入時不會出現。
   2. App 在 iframe 裡走的是 google.script.run，完全不需要跨網域 fetch，
      也就不會踩到 CORS / 401 的問題。
  Apps Script 網址由 #u= 帶入後存在本機，不寫死在這個公開的原始碼裡。
*/
var KEY = 'couple_app_host_url';

function readUrl(){
  var q = {};
  if(location.hash.length > 1){
    location.hash.slice(1).split('&').forEach(function(kv){
      var i = kv.indexOf('=');
      if(i > 0) q[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
    });
  }
  if(q.u && /^https:\/\/script\.google\.com\//.test(q.u)){
    try{ localStorage.setItem(KEY, q.u); }catch(e){}
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    return q.u;
  }
  try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; }
}

var url = readUrl();
var msg = document.getElementById('msg');

if(!url){
  msg.innerHTML = '<b>還沒設定</b>第一次開啟請用結尾帶 <code>#u=…</code> 的完整網址，' +
                  '設定會存在這台裝置，之後開這個短網址就可以了。';
}else{
  var f = document.createElement('iframe');
  f.src = url;
  f.allow = 'geolocation';
  f.onload = function(){ if(msg && msg.parentNode) msg.parentNode.removeChild(msg); };
  f.onerror = function(){
    msg.innerHTML = '<b>載入失敗</b>打不開 Apps Script 網址，請確認它還有效。';
  };
  document.body.appendChild(f);
}
</script>
</body>
</html>
