<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小天地">
<meta name="theme-color" content="#0b090d">
<title>我們的小天地</title>
<style>
  html,body{margin:0;height:100%;background:#0b090d;overflow:hidden}
  iframe{border:0;width:100%;height:100%;display:block;background:#0b090d}
  #setup{
    box-sizing:border-box;height:100%;overflow-y:auto;
    padding:56px 22px;color:#9d92a4;
    font:15px/1.75 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  }
  #setup h1{color:#f4ecf3;font-size:20px;margin:0 0 10px;text-align:center}
  #setup p{margin:0 0 18px;text-align:center}
  #setup input{
    box-sizing:border-box;width:100%;padding:13px 14px;font-size:16px;
    border:1px solid rgba(255,255,255,.13);border-radius:14px;
    background:#1e1925;color:#f4ecf3;font-family:inherit;
  }
  #setup input:focus{outline:none;border-color:rgba(255,111,145,.55)}
  #setup button{
    width:100%;margin-top:12px;padding:14px;border:0;border-radius:14px;
    background:linear-gradient(135deg,#ff6f91,#c78bff);color:#fff;
    font:700 15px/1 inherit;font-family:inherit;cursor:pointer;
  }
  #setup small{display:block;margin-top:18px;font-size:12.5px;line-height:1.8;color:#6b6273}
  #err{color:#ff7a7a;margin-top:12px;text-align:center;min-height:20px;font-size:13px}
  .dot{
    width:9px;height:9px;border-radius:50%;margin:0 auto 20px;
    background:linear-gradient(135deg,#ff6f91,#c78bff);
    box-shadow:0 0 14px rgba(255,111,145,.7);
    animation:pulse 1.4s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
  #loading{padding:70px 20px;text-align:center;color:#9d92a4;
    font:15px -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
</style>
</head>
<body>
<div id="loading"><div class="dot"></div>載入中…</div>
<script>
/*
  外框頁。真正的 App 由 Apps Script 發出，這裡用 iframe 把它包起來，目的有二：
   1. Google 那條「本應用程式由 Apps Script 使用者建立」公告只出現在最上層頁面，
      被 iframe 嵌入時不會出現。
   2. App 在 iframe 裡走 google.script.run，完全不需要跨網域 fetch，
      也就不會踩到 CORS / 401 / 403。
  Apps Script 網址由 #u= 帶入，不寫死在這個公開的原始碼裡。

  注意：這裡「不會」把 #u= 從網址清掉。
  iOS 從主畫面開啟的 Web App 有獨立的儲存空間，讀不到 Safari 存的東西；
  保留 hash 才能讓「加到主畫面」記住的網址每次啟動都帶著設定。
*/
var KEY = 'couple_app_host_url';
var EXEC_RE = /https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec[^\s"'<>&]*/;
var VALID = function(u){ return !!u && EXEC_RE.test(u); };

// 使用者最自然會貼的就是「收到的那整串連結」，所以三種都要吃：
//   1. 外框頁網址（含 #u=… 或 ?u=…，值是 URL-encoded 的）
//   2. 純粹的 /exec 網址
//   3. 夾在一整段文字裡的 /exec 網址
function extractExec(raw){
  var v = (raw || '').trim();
  if(!v) return '';
  var m = v.match(/[#&?]u=([^&\s]+)/);
  if(m){
    var dec = '';
    try{ dec = decodeURIComponent(m[1]); }catch(e){ dec = m[1]; }
    var hit = dec.match(EXEC_RE);
    if(hit) return hit[0];
  }
  var direct = v.match(EXEC_RE);
  return direct ? direct[0] : '';
}

function fromHash(){
  if(location.hash.length < 2) return '';
  var q = {};
  location.hash.slice(1).split('&').forEach(function(kv){
    var i = kv.indexOf('=');
    if(i > 0) q[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1).replace(/\+/g,' '));
  });
  return q.u || '';
}
function remember(u){ try{ localStorage.setItem(KEY, u); }catch(e){} }
function recall(){ try{ return localStorage.getItem(KEY) || ''; }catch(e){ return ''; } }

// iframe 內部讀不到 env(safe-area-inset-*)（永遠是 0），但 iframe 又必須鋪滿整個
// 畫面才不會出現上下黑邊。所以在外框頁量出實際數值，用網址參數傳進去給 App 套用。
function safeInsets(){
  var probe = document.createElement('div');
  probe.style.cssText =
    'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;' +
    'padding-top:env(safe-area-inset-top,0px);' +
    'padding-bottom:env(safe-area-inset-bottom,0px);';
  document.body.appendChild(probe);
  var cs = getComputedStyle(probe);
  var t = Math.round(parseFloat(cs.paddingTop) || 0);
  var b = Math.round(parseFloat(cs.paddingBottom) || 0);
  probe.parentNode.removeChild(probe);
  return { t: t, b: b };
}

function boot(u){
  remember(u);
  var ins = safeInsets();
  var f = document.createElement('iframe');
  f.src = u + (u.indexOf('#') >= 0 ? '&' : '#') + 'st=' + ins.t + '&sb=' + ins.b;
  f.allow = 'geolocation';
  f.onload = function(){
    var l = document.getElementById('loading');
    if(l && l.parentNode) l.parentNode.removeChild(l);
    var s = document.getElementById('setup');
    if(s && s.parentNode) s.parentNode.removeChild(s);
  };
  document.body.appendChild(f);
}

function showSetup(){
  var l = document.getElementById('loading');
  if(l && l.parentNode) l.parentNode.removeChild(l);
  var d = document.createElement('div');
  d.id = 'setup';
  d.innerHTML =
    '<h1>先設定一次</h1>' +
    '<p>把收到的連結整串貼進來就好，之後這台裝置就不用再設定了。</p>' +
    '<input id="u" type="url" inputmode="url" autocapitalize="off" autocorrect="off" ' +
    'placeholder="把收到的連結整串貼進來">' +
    '<button id="go">開始使用</button>' +
    '<div id="err"></div>' +
    '<small>從主畫面圖示開啟的話，iPhone 會給它一個和 Safari 分開的儲存空間，' +
    '所以可能需要在這裡再貼一次。貼過就會記住。</small>';
  document.body.appendChild(d);
  document.getElementById('go').onclick = function(){
    var v = extractExec(document.getElementById('u').value);
    if(!v){
      document.getElementById('err').textContent =
        '這串裡面找不到 Apps Script 網址，請確認有複製完整。';
      return;
    }
    boot(v);
  };
}

var u = extractExec(fromHash()) || extractExec(recall());
if(u) boot(u); else showSetup();
</script>
</body>
</html>
